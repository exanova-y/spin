<!--
  adiabatic.garden — open access terminal
  Drop-in component. Paste a DOI / paper URL, it probes the legal open-access
  ecosystem for free full-text copies.

  Sources: OpenAlex · Unpaywall · Semantic Scholar · arXiv/bioRxiv · Internet Archive
  (+ author / repository green-OA copies surfaced from the above)

  HOW TO EMBED
  1. Easiest: <iframe src="oa-terminal.html" style="width:100%;height:520px;border:0"></iframe>
  2. Or lift the <section id="ag-oa"> ... </section> block + the <style> + <script>
     into your page. Everything is namespaced under #ag-oa so it won't collide.

  ONE THING TO CHANGE: replace the OA_EMAIL constant below with your own email.
  Unpaywall asks for a contact address (it's how they keep the API free & unauthed).
-->
<style>
#ag-oa{
  --bg:#0b0e0c;
  --line:#4f9d52;
  --line-dim:#274f29;
  --text:#cfe0cf;
  --dim:#6e8270;
  --green:#8ad65f;
  --purple:#b39ddb;
  --amber:#d8c15c;
  --cyan:#74c0d6;
  --red:#d97f6c;
  --mono: "Berkeley Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-family:var(--mono);
  color:var(--text);
  background:var(--bg);
  border:1px solid var(--line);
  padding:0;
  font-size:14px;
  line-height:1.55;
  max-width:100%;
  box-sizing:border-box;
}
#ag-oa *{box-sizing:border-box}
#ag-oa .ag-title{
  border-bottom:1px solid var(--line-dim);
  padding:.5rem .85rem;
  color:var(--green);
  display:flex;flex-wrap:wrap;gap:.6rem;align-items:baseline;
  user-select:none;
}
#ag-oa .ag-title .ag-sub{color:var(--dim);font-size:12.5px}
#ag-oa .ag-screen{
  padding:.85rem;
  min-height:190px;
  max-height:46vh;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--line-dim) transparent;
  white-space:pre-wrap;
  word-break:break-word;
}
#ag-oa .ag-screen::-webkit-scrollbar{width:8px}
#ag-oa .ag-screen::-webkit-scrollbar-thumb{background:var(--line-dim)}
#ag-oa .ag-l{margin:0}
#ag-oa .dim{color:var(--dim)}
#ag-oa .green{color:var(--green)}
#ag-oa .purple{color:var(--purple)}
#ag-oa .amber{color:var(--amber)}
#ag-oa .cyan{color:var(--cyan)}
#ag-oa .red{color:var(--red)}
#ag-oa a{color:var(--purple);text-decoration:underline;text-underline-offset:2px}
#ag-oa a:hover{color:var(--amber)}
#ag-oa a:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
#ag-oa .ag-echo{color:var(--text)}
#ag-oa .ag-echo .p{color:var(--green)}
#ag-oa .ag-row{display:flex;gap:.5rem;align-items:baseline}
#ag-oa .ag-tag{color:var(--dim)}
#ag-oa .best{color:var(--amber)}
#ag-oa .ag-hr{color:var(--line-dim);user-select:none}
#ag-oa .ag-promptline{
  display:flex;align-items:center;gap:.4rem;
  border-top:1px solid var(--line-dim);
  padding:.55rem .85rem;
}
#ag-oa .ag-ps1{color:var(--green);white-space:nowrap;user-select:none}
#ag-oa .ag-ps1 .u{color:var(--cyan)}
#ag-oa .ag-ps1 .path{color:var(--purple)}
#ag-oa input.ag-in{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--text);font-family:var(--mono);font-size:14px;
  caret-color:var(--green);padding:0;min-width:0;
}
#ag-oa input.ag-in::placeholder{color:var(--dim)}
#ag-oa .ag-foot{
  border-top:1px solid var(--line-dim);
  padding:.4rem .85rem;color:var(--dim);font-size:11.5px;
  display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;
}
#ag-oa .spin{color:var(--cyan)}
@media (max-width:520px){
  #ag-oa{font-size:13px}
  #ag-oa .ag-ps1 .host{display:none}
}
</style>

<section id="ag-oa" aria-label="open access paper terminal">
  <div class="ag-title">
    <span>[ open access terminal ]</span>
    <span class="ag-sub">— resolve a paper to free, legal full-text</span>
  </div>
  <div class="ag-screen" id="agScreen" tabindex="0" aria-live="polite"></div>
  <div class="ag-promptline">
    <span class="ag-ps1"><span class="u">guest</span>@<span class="host">adiabatic.garden</span><span class="path">:~</span>$</span>
    <input class="ag-in" id="agIn" autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="paste a DOI or paper URL, then ↵   (try: help)" aria-label="paper DOI or URL">
  </div>
  <div class="ag-foot">
    <span>sources: openalex · unpaywall · semantic scholar · arxiv/biorxiv · archive.org</span>
    <span>legal open-access only</span>
  </div>
</section>

<script>
(function(){
  "use strict";
  const OA_EMAIL = "openaccess@adiabatic.garden"; // <-- change to your email

  const screen = document.getElementById("agScreen");
  const input  = document.getElementById("agIn");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep  = ms => new Promise(r=>setTimeout(r, reduce?0:ms));

  // ---------- terminal I/O ----------
  function el(tag, cls, html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  function print(html, cls){
    const line=el("div","ag-l "+(cls||""), html);
    screen.appendChild(line);
    screen.scrollTop=screen.scrollHeight;
    return line;
  }
  async function type(html, cls, cps){ // cheap typewriter for headers
    if(reduce) return print(html,cls);
    const line=print("",cls);
    const tmp=el("span",null,html);
    const text=tmp.textContent;
    let shown="";
    for(let i=0;i<text.length;i++){ shown+=text[i]; line.textContent=shown; if(i%2===0) await sleep(1000/(cps||220)); }
    line.innerHTML=html; screen.scrollTop=screen.scrollHeight;
    return line;
  }
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- input parsing ----------
  function extractDOI(str){
    if(!str) return null;
    const m=str.match(/10\.\d{4,9}\/[-._;()\/:A-Za-z0-9]+/);
    if(!m) return null;
    let doi=m[0].replace(/[.,;>)\]}"']+$/,"");
    if(/^10\.1101\//.test(doi)) doi=doi.replace(/v\d+$/i,""); // bioRxiv/medRxiv version suffix
    return doi;
  }
  function extractArxiv(str){
    if(!str) return null;
    let m=str.match(/arxiv\.org\/(?:abs|pdf)\/([^\s?#]+?)(?:\.pdf)?(?:[?#].*)?$/i);
    if(m) return m[1].replace(/v\d+$/i,"");
    m=str.match(/^\s*(?:arxiv:)?\s*(\d{4}\.\d{4,5})(?:v\d+)?\s*$/i);
    if(m) return m[1];
    m=str.match(/^\s*([a-z-]+(?:\.[A-Z]{2})?\/\d{7})(?:v\d+)?\s*$/);
    if(m) return m[1];
    return null;
  }
  const looksUrl = s => /^https?:\/\//i.test(s.trim());

  // ---------- fetch helper ----------
  function fetchJSON(url, ms){
    ms=ms||9000;
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),ms);
    return fetch(url,{signal:ctrl.signal,headers:{"Accept":"application/json"}})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .finally(()=>clearTimeout(t));
  }

  // normalize a found copy into {url, host, kind, source}
  function pushCopy(list, seen, copy){
    if(!copy || !copy.url) return;
    let key=copy.url.replace(/^https?:\/\//,"").replace(/\/+$/,"").toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    list.push(copy);
  }

  // classify version/host into a short human label
  function kindLabel(host, version){
    const v=(version||"").toLowerCase();
    if(/publish/.test(v)) return "published PDF";
    if(/accept/.test(v))  return "accepted MS";
    if(/submit|preprint/.test(v)) return "preprint";
    if(host==="publisher") return "publisher OA";
    if(host==="repository") return "repository copy";
    return "free copy";
  }

  // ---------- source probes ----------
  async function probeOpenAlex(doi, meta, copies, seen){
    const j=await fetchJSON("https://api.openalex.org/works/doi:"+encodeURIComponent(doi)+"?mailto="+encodeURIComponent(OA_EMAIL));
    if(j.title && !meta.title) meta.title=j.title;
    if(j.publication_year && !meta.year) meta.year=j.publication_year;
    if(!meta.authors && j.authorships) meta.authors=j.authorships.slice(0,4).map(a=>a.author&&a.author.display_name).filter(Boolean);
    const locs=[];
    if(j.best_oa_location) locs.push(j.best_oa_location);
    if(Array.isArray(j.locations)) locs.push(...j.locations);
    let n=0;
    for(const L of locs){
      if(!L||!L.is_oa) continue;
      const url=L.pdf_url||L.landing_page_url;
      if(!url) continue;
      const hostType=(L.source&&L.source.type==="repository")?"repository":"publisher";
      pushCopy(copies,seen,{url,host:hostType,version:L.version,source:(L.source&&L.source.display_name)||"openalex"});
      n++;
    }
    return n;
  }
  async function probeUnpaywall(doi, meta, copies, seen){
    const j=await fetchJSON("https://api.unpaywall.org/v2/"+encodeURIComponent(doi)+"?email="+encodeURIComponent(OA_EMAIL));
    if(j.title && !meta.title) meta.title=j.title;
    if(!j.is_oa || !Array.isArray(j.oa_locations)) return 0;
    let n=0;
    for(const L of j.oa_locations){
      const url=L.url_for_pdf||L.url;
      if(!url) continue;
      pushCopy(copies,seen,{url,host:L.host_type==="repository"?"repository":"publisher",version:L.version,source:L.repository_institution||"unpaywall"});
      n++;
    }
    return n;
  }
  async function probeS2(doi, meta, copies, seen){
    const j=await fetchJSON("https://api.semanticscholar.org/graph/v1/paper/DOI:"+encodeURIComponent(doi)+"?fields=title,openAccessPdf");
    if(j.title && !meta.title) meta.title=j.title;
    if(j.openAccessPdf && j.openAccessPdf.url){
      pushCopy(copies,seen,{url:j.openAccessPdf.url,host:"repository",version:j.openAccessPdf.status,source:"semantic scholar"});
      return 1;
    }
    return 0;
  }
  async function probeCrossrefMeta(doi, meta){
    try{
      const j=await fetchJSON("https://api.crossref.org/works/"+encodeURIComponent(doi));
      const m=j.message||{};
      if(!meta.title && m.title && m.title[0]) meta.title=m.title[0];
      if(!meta.year && m.issued && m.issued["date-parts"]) meta.year=m.issued["date-parts"][0][0];
      if(!meta.authors && m.author) meta.authors=m.author.slice(0,4).map(a=>[a.given,a.family].filter(Boolean).join(" "));
    }catch(e){}
  }
  async function probeWayback(url, copies, seen){
    const j=await fetchJSON("https://archive.org/wayback/available?url="+encodeURIComponent(url));
    const snap=j.archived_snapshots&&j.archived_snapshots.closest;
    if(snap&&snap.available&&snap.url){
      pushCopy(copies,seen,{url:snap.url.replace(/^http:/,"https:"),host:"archive",version:"archived page",source:"internet archive ("+(snap.timestamp||"").slice(0,4)+")"});
      return 1;
    }
    return 0;
  }

  // ---------- a live status row that resolves ----------
  async function runProbe(label, fn){
    const row=print('<span class="spin">[····]</span> <span class="dim">'+esc(label)+'</span>');
    const frames=["[·   ]","[··  ]","[··· ]","[····]"]; let i=0, alive=true;
    const anim=reduce?null:setInterval(()=>{ if(!alive)return; row.innerHTML='<span class="spin">'+frames[i++%4]+'</span> <span class="dim">'+esc(label)+'</span>'; },130);
    try{
      const count=await fn();
      alive=false; if(anim)clearInterval(anim);
      if(count>0) row.innerHTML='<span class="green">[ ok ]</span> '+esc(label)+' <span class="dim">→ '+count+' copy'+(count>1?"ies":"")+'</span>';
      else row.innerHTML='<span class="dim">[ -- ] '+esc(label)+' — none</span>';
    }catch(e){
      alive=false; if(anim)clearInterval(anim);
      const reason=/abort/i.test(e.message)?"timeout":(e.message||"blocked");
      row.innerHTML='<span class="red">[err ]</span> <span class="dim">'+esc(label)+' — '+esc(reason)+'</span>';
    }
  }

  // ---------- main resolve flow ----------
  let busy=false;
  async function resolve(raw){
    const doi=extractDOI(raw);
    const arx=extractArxiv(raw);
    const meta={title:null,year:null,authors:null};
    const copies=[]; const seen=new Set();

    await type("parsing input …","cyan",260);
    await sleep(90);

    if(!doi && !arx && !looksUrl(raw)){
      print('<span class="red">could not find a DOI, arXiv id, or URL in that.</span>');
      print('<span class="dim">paste a DOI (10.xxxx/…), an arxiv id/link, or a paper URL. type </span><span class="green">help</span><span class="dim"> for examples.</span>');
      return;
    }

    // arXiv fast-path
    if(arx){
      const isOld=/\//.test(arx);
      const pdf="https://arxiv.org/pdf/"+arx+(isOld?"":"")+".pdf";
      const abs="https://arxiv.org/abs/"+arx;
      pushCopy(copies,seen,{url:pdf,host:"repository",version:"preprint",source:"arXiv"});
      print('<span class="green">[ ok ]</span> arXiv id <span class="amber">'+esc(arx)+'</span> <span class="dim">→ preprint is openly hosted</span>');
      meta.title=meta.title||("arXiv:"+arx);
      meta._absurl=abs;
    }

    if(doi){
      print('resolved DOI  <span class="amber">'+esc(doi)+'</span>');
      // metadata first (best-effort, don't block on failure)
      await probeCrossrefMeta(doi, meta);
      if(meta.title) print('  <span class="dim">'+esc(meta.title)+(meta.year?("  ("+meta.year+")"):"")+'</span>');
      if(meta.authors&&meta.authors.length) print('  <span class="dim">'+esc(meta.authors.join(", "))+(meta.authors.length>=4?" et al.":"")+'</span>');
      print('<span class="ag-hr">'+"─".repeat(38)+'</span>');

      await runProbe("openalex", ()=>probeOpenAlex(doi,meta,copies,seen));
      await runProbe("unpaywall", ()=>probeUnpaywall(doi,meta,copies,seen));
      await runProbe("semantic scholar", ()=>probeS2(doi,meta,copies,seen));
      await runProbe("internet archive", ()=>probeWayback("https://doi.org/"+doi,copies,seen));
    } else if(looksUrl(raw) && !arx){
      print('<span class="dim">no DOI embedded in that URL — checking the Internet Archive, and you can paste the paper\'s DOI for full coverage.</span>');
      print('<span class="ag-hr">'+"─".repeat(38)+'</span>');
      await runProbe("internet archive", ()=>probeWayback(raw,copies,seen));
    }

    // ---------- results ----------
    print("");
    if(!copies.length){
      print('<span class="amber">no free legal copy located.</span>');
      print('<span class="dim">next moves that often work: check the author\'s personal / lab page, look for a preprint on arxiv/biorxiv/psyarxiv, search the author\'s institutional repository, or email the corresponding author — most will send a PDF happily.</span>');
      return;
    }
    // rank: published publisher OA > accepted repo > preprint > archive
    const score=c=>{
      const v=(c.version||"").toLowerCase();
      if(c.host==="publisher"&&/publish/.test(v)) return 0;
      if(/publish/.test(v)) return 1;
      if(/accept/.test(v)) return 2;
      if(c.host==="publisher") return 3;
      if(/preprint|submit/.test(v)) return 4;
      if(c.host==="archive") return 6;
      return 5;
    };
    copies.sort((a,b)=>score(a)-score(b));
    await type(copies.length+" free "+(copies.length>1?"copies":"copy")+" found:","green",240);
    copies.forEach((c,i)=>{
      const best=i===0;
      const tag=kindLabel(c.host,c.version);
      const mark=best?'<span class="best">★</span>':'<span class="dim">•</span>';
      print(
        '<div class="ag-row">'+mark+
        ' <a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.url.length>72?c.url.slice(0,71)+"…":c.url)+'</a>'+
        ' <span class="ag-tag">['+esc(tag)+' · '+esc(c.source)+']</span></div>'
      );
    });
    if(copies[0]) print('<span class="dim">opening best copy…</span>');
    if(copies[0]){ try{ window.open(copies[0].url,"_blank","noopener"); }catch(e){} }
  }

  // ---------- commands ----------
  function help(){
    print('<span class="green">open access terminal</span> — finds free, legal full-text of a paper.');
    print('');
    print('<span class="dim">usage:</span> paste one of —');
    print('  <span class="purple">a DOI</span>        10.1038/s41586-021-03819-2');
    print('  <span class="purple">a DOI url</span>    https://doi.org/10.1016/j.neuron.2019.01.002');
    print('  <span class="purple">an arxiv id</span>  2010.11929   ·   arxiv.org/abs/1706.03762');
    print('  <span class="purple">a paper url</span>  a nature/ieee/springer/etc. link');
    print('');
    print('<span class="dim">it probes:</span> openalex · unpaywall · semantic scholar · arxiv/biorxiv · archive.org');
    print('<span class="dim">plus author &amp; repository green-OA copies surfaced from those.</span>');
    print('');
    print('<span class="dim">commands:</span> <span class="green">help</span>  <span class="green">clear</span>');
  }
  function boot(){
    print('<span class="dim">adiabatic.garden — open access terminal · v1</span>');
    print('<span class="dim">type</span> <span class="green">help</span> <span class="dim">or paste a DOI / paper URL.</span>');
  }

  async function submit(raw){
    if(busy) return;
    raw=raw.trim();
    print('<span class="ag-echo"><span class="p">$</span> '+esc(raw)+'</span>');
    if(!raw) return;
    if(/^clear$/i.test(raw)){ screen.innerHTML=""; boot(); return; }
    if(/^(help|\?|man)$/i.test(raw)){ help(); return; }
    busy=true; input.disabled=true;
    try{ await resolve(raw); }
    catch(e){ print('<span class="red">unexpected error: '+esc(e.message||e)+'</span>'); }
    finally{ busy=false; input.disabled=false; input.focus(); print('<span class="ag-hr">'+"─".repeat(38)+'</span>'); }
  }

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ const v=input.value; input.value=""; submit(v); }
  });
  screen.addEventListener("click",()=>{ if(!busy) input.focus(); });

  boot();
})();
</script>
